[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-isl"
version = "0.1.0"
description = "Context-Gated Signer-Adaptive Bidirectional Indian Sign Language System"
readme = "docs/README.md"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Bi-ISL Core Architecture Team" }
]
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0,<2.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0,<3.0.0",
    "requests>=2.30.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
core = [
    "torch>=2.1.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "tqdm>=4.65.0",
]
vision = [
    "opencv-python-headless>=4.8.0",
    "mediapipe>=0.10.0",
    "pillow>=10.0.0",
    "torchvision>=0.16.0",
]
training = [
    "tensorboard>=2.14.0",
    "accelerate>=0.24.0",
]
evaluation = [
    "sacrebleu>=2.3.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "scikit-learn>=1.3.0",
]
development = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
deployment = [
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
]
optionalresearch = [
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "evaluate>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
